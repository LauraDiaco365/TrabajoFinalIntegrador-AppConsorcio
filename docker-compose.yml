services:
  db:
    image: postgres:16
    container_name: consorcio360_db
    restart: always
    environment:
      POSTGRES_DB: consorcio360_minio
      POSTGRES_USER: consorcioadmin
      POSTGRES_PASSWORD: consorcioadmin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: consorcio360_redis
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: consorcio360_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: consorcioadmin
      MINIO_ROOT_PASSWORD: consorcioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
